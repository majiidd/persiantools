[build-system]
requires = ["setuptools>=82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "persiantools"
dynamic = ["version"]
description = "Jalali (Shamsi/Persian) date and datetime with Persian digits and character utilities"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Majid Hajiloo", email = "majid.hajiloo@gmail.com" }
]
keywords = [
    "jalali",
    "shamsi",
    "khorshidi",
    "persian",
    "farsi",
    "iranian",
    "calendar",
    "date",
    "datetime",
    "timezone",
    "gregorian",
    "converter",
    "jdate",
    "jdatetime",
    "jalalidate",
    "jalalidatetime",
    "persian-calendar",
    "persian-date",
    "persian-digits",
    "arabic-digits",
    "number-to-words",
    "characters",
    "normalization",
    "localization",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: Persian",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Localization",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "tzdata; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/majiidd/persiantools"
Source = "https://github.com/majiidd/persiantools"
Issues = "https://github.com/majiidd/persiantools/issues"
Changelog = "https://github.com/majiidd/persiantools/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "coverage>=7.10.0,<8.0.0",
    "pre-commit>=4.3.0,<5.0.0",
]

[tool.uv]
required-version = ">=0.11.0"

[tool.setuptools.dynamic]
version = { attr = "persiantools.__version__" }

[tool.setuptools.packages.find]
include = ["persiantools*"]

[tool.setuptools.package-data]
persiantools = ["py.typed"]

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312", "py313", "py314"]
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_incomplete_defs = false
no_implicit_optional = true
check_untyped_defs = false
ignore_missing_imports = false
